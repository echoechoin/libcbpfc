name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config meson ninja-build clang \
          libpcap-dev libbpf-dev libelf-dev

    - name: Configure
      run: meson setup build

    - name: Build
      run: ninja -C build

    # test_to_c and test_ebpf. The second one loads BPF programs, which the
    # runners do not allow, so it exits 77 and meson reports it as skipped -
    # the generated C is what actually gets checked here.
    - name: Test
      run: meson test -C build --print-errorlogs
